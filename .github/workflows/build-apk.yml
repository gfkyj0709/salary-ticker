# Build APK on every push to main and publish it as a GitHub Release
# main에 push할 때마다 APK를 빌드해서 Release로 올림 (폰에서 바로 다운로드)
name: Build APK

on:
  push:
    branches: [main]      # Build on main push / main push 시 빌드
  workflow_dispatch:      # Manual run button / 수동 실행 버튼

permissions:
  contents: write         # Needed to create releases / 릴리스 생성 권한

jobs:
  build:
    runs-on: ubuntu-latest  # Has Android SDK preinstalled / 안드로이드 SDK 기본 설치됨
    steps:
      - uses: actions/checkout@v4                 # Get code / 코드 가져오기
      - uses: actions/setup-java@v4               # JDK 17 / 자바 17
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4      # Gradle 8.9 (no wrapper jar needed) / 래퍼 jar 없이 그래들 설치
        with:
          gradle-version: '8.9'
      - run: gradle testDebugUnitTest assembleDebug # Test math, then build APK / 계산 테스트 후 APK 빌드
      - run: mv app/build/outputs/apk/debug/app-debug.apk SalaryTicker.apk # Rename / 이름 변경
      - uses: softprops/action-gh-release@v2      # Publish release / 릴리스 게시
        with:
          tag_name: build-${{ github.run_number }}
          name: 초당월급 build ${{ github.run_number }}
          files: SalaryTicker.apk
