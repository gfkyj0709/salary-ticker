# Manual smoke test: anonymous login → write → read on Firestore
# 수동 점검: 익명 로그인 → 쓰기 → 읽기 (Firebase 콘솔 설정 확인용)
name: Check Firebase

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/check-firebase.yml']   # Runs when this file changes / 이 파일 바뀌면 실행

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: |
          KEY=$(jq -r '.client[0].api_key[0].current_key' app/google-services.json)   # API key / API 키
          PID=$(jq -r '.project_info.project_id' app/google-services.json)            # Project ID / 프로젝트 ID
          echo "== 1. anonymous sign-in / 익명 로그인"
          R=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$KEY" -H 'Content-Type: application/json' -d '{"returnSecureToken":true}')
          TOKEN=$(echo "$R" | jq -r '.idToken // empty'); UID_=$(echo "$R" | jq -r '.localId // empty')
          [ -n "$TOKEN" ] || { echo "FAIL auth: $R"; exit 1; }
          echo "OK uid=$UID_"
          DOC="https://firestore.googleapis.com/v1/projects/$PID/databases/(default)/documents/users_v2/$UID_"
          body() { echo '{"fields":{"nickname":{"stringValue":"ci"},"group":{"stringValue":"CITEST"},"monthly":{"doubleValue":'"$1"'},"hourly":{"doubleValue":20000},"startMin":{"integerValue":"540"},"endMin":{"integerValue":"1080"},"lunchStartMin":{"integerValue":"720"},"lunchMin":{"integerValue":"60"},"otDate":{"stringValue":"ci"},"otAccMs":{"integerValue":"0"},"otAccPay":{"doubleValue":0},"otSince":{"integerValue":"0"},"weekKey":{"stringValue":"ci"},"otWeekBase":{"doubleValue":0},"monthKey":{"stringValue":"ci"},"otMonthBase":{"doubleValue":0},"lastDay":{"stringValue":"2000-01-01"}}}'; }
          echo "== 2. valid write users_v2 / 정상 쓰기"
          W=$(curl -s -X PATCH "$DOC" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$(body 4200000)")
          echo "$W" | jq -e '.name' >/dev/null || { echo "FAIL write: $W"; exit 1; }
          echo "OK"
          echo "== 3. cheat write must be rejected / 조작값 거부 확인"
          C=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH "$DOC" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$(body 999999999)")
          [ "$C" = "403" ] && echo "OK rejected" || { echo "FAIL rules not applied (http $C)"; exit 1; }
          echo "== 4. public read / 공개 읽기"
          G=$(curl -s "$DOC"); echo "$G" | jq -e '.fields.nickname' >/dev/null && echo "OK" || { echo "FAIL read: $G"; exit 1; }
          echo "(test doc has lastDay 2000-01-01, so the app hides it / 테스트 문서는 앱에서 숨겨짐)"
